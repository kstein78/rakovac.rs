# /etc/nginx/sites-available/rakovac.rs
# Static site built by Hugo and uploaded by GitHub Actions to /var/www/rakovac.rs
# HTTPS certificates: sudo certbot --nginx -d rakovac.rs -d www.rakovac.rs

server {
    listen 80;
    listen [::]:80;
    server_name rakovac.rs www.rakovac.rs;
    # certbot adds the redirect to HTTPS here
    root /var/www/rakovac.rs;
    location /.well-known/acme-challenge/ { allow all; }
}

server {
    # listen 443 ssl; listen [::]:443 ssl;   <- certbot fills these in
    server_name www.rakovac.rs;
    return 301 https://rakovac.rs$request_uri;
}

server {
    # listen 443 ssl http2; listen [::]:443 ssl http2;   <- certbot fills these in
    server_name rakovac.rs;
    root /var/www/rakovac.rs;
    index index.html;
    charset utf-8;

    # Language entry point. Today only English is published.
    # When Serbian goes live, change to /sr/ or route by Accept-Language.
    location = / { return 302 /en/; }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /en/404.html;

    # CSS/JS file names contain a content hash, so they can be cached for a year
    location ~* ^/(css|js)/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location ~* ^/(fonts|vendor)/ {
        expires 30d;
        try_files $uri =404;
    }
    location ~* \.(jpg|jpeg|png|webp|avif|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
}
