{{/* Old map viewer, loads the full scan only when the visitor asks for it.
  {{< oldmap src="FULL_IMAGE_URL" poster="SMALL_THUMB_URL" x="3150" y="1500" size="4.7 MB" link="SOURCE_PAGE" alt="…" >}}Caption (markdown){{< /oldmap >}}
  x / y = pixel of the full image to centre on (e.g. Rakovac). */}}
<figure class="oldmap" data-x="{{ .Get "x" | default 0 }}" data-y="{{ .Get "y" | default 0 }}">
  <div class="oldmap-view">
    <img class="oldmap-poster" src="{{ .Get "poster" }}" alt="" loading="lazy">
    <button type="button" class="oldmap-load" data-src="{{ .Get "src" }}" data-alt="{{ .Get "alt" }}">
      <span class="oldmap-btn">{{ i18n "map_show" }}</span>
      {{ with .Get "size" }}<span class="small">{{ . }}</span>{{ end }}
    </button>
  </div>
  <figcaption>{{ .Inner | markdownify }}{{ with .Get "link" }} <a href="{{ . }}" rel="noopener">{{ i18n "map_source" }}</a>{{ end }}<br><span class="small muted">{{ i18n "map_hint" }}</span></figcaption>
</figure>
