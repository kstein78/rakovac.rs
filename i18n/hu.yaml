gd_plan_title: "A Gradina vázlatos alaprajza korszakonként"
gd_plan_cap: "A Gradina korszakról korszakra. Válasszon korszakot: épületei teli vonallal látszanak, a régebbiek halvány körvonalként maradnak alattuk, mert minden nemzedék az előző romjaira épített."
gd_not_to_scale: "Vázlat, nem méretarányos: a formák publikált leírásokat követnek, nem felmért alaprajzot."
gd_leg_d: "a források eltérnek"
gd_leg_a: "a rajz feltételezése"
gd_p0_name: "Vaskor"
gd_p0_when: "Újkőkor, majd a korai vaskor"
gd_p0_1: "A domb legrégebbi leletei újkőkoriak, mintegy 7000 évesek."
gd_p0_2: "A legalsó rétegekben egy korai vaskori földsánc maradványai vannak."
gd_p0_3: "A sánc formája és mérete csak szemléltető rajz."
gd_p1_name: "Római villa"
gd_p1_when: "Késő római kor, 3–4. század"
gd_p1_1: "Villa hypocaustummal, a római padlófűtéssel."
gd_p1_2: "Mozaikpadlókról és vízvezetékről is beszámolnak."
gd_p1_3: "A helyiségek elrendezése és a kemence helye feltételezés."
gd_p2_name: "Bazilika"
gd_p2_when: "12. század"
gd_p2_1: "Mintegy 32 m hosszú, román stílusú háromhajós bazilika három félköríves apszissal és kriptával."
gd_p2_2: "Faragott márvány szentélyrekesztő választotta el a hajót az oltártól."
gd_p2_3: "A keltezés vitatott: a 12. század eleje, Kálmán király kora, vagy alapítás 1176–86-ban."
gd_p3_name: "Szent György-apátság"
gd_p3_when: "1237 – 15. század"
gd_p3_1: "Először egy 1237-es oklevél említi („Abbas de Dombo”)."
gd_p3_2: "1390: a dombói Szent György-monostor a kalocsai egyházmegyében."
gd_p3_3: "1416: György apátot oszmán portyázók ejtik fogságba."
gd_p4_name: "Erőd"
gd_p4_when: "1467–1473"
gd_p4_1: "Az apátságot falakkal, kapukkal és vizesárokkal erőddé alakítják."
gd_p4_2: "Háromoldalú apszisú gótikus templom épül, részben a román kori alapokon."
gd_p4_3: "A fal és az árok vonala csak a leírás alapján készült."
gd_p5_name: "Romok és ma"
gd_p5_when: "1526 – napjainkig"
gd_p5_1: "1526: Dombó elesik a Mohácsnál végződő oszmán hadjáratban."
gd_p5_2: "Végső lerombolás: egyes források 1702-t, mások 1792-t említenek."
gd_p5_3: "A Vajdasági Múzeum ásatásai 1963–1978-ban és később; védett kulturális örökség."
