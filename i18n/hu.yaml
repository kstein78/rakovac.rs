# Old photos call and photo archive
pc_title: "Vannak régi fényképei Rakovacról?"
pc_text: "Rakovac fényképeit gyűjtjük minden korból: utcák és házak, ünnepek és lakodalmak, munka a mezőn és a szőlőben, emberek népviseletben vagy partizánegyenruhában, az iskola, a kolostor. Küldjön fotót, szkennelt képet vagy csak egy telefonos felvételt egy régi képről, és írja meg, ki látható rajta és mikor, ha tudja. Feltüntetjük, ki küldte be és ki készítette."
pc_visit: "Nincs lehetősége szkennelni? Konstantin, az oldal készítője, szívesen elmegy Önhöz, és otthon lefényképezi a képeket; az eredetik Önnél maradnak. Hívja vagy írjon:"
pc_consent: "Fényképet csak az Ön engedélyével teszünk közzé, és kérésére azonnal eltávolítjuk."
