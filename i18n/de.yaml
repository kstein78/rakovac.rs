gd_hy_title: "Wie ein Hypokaustum einen Raum heizte"
gd_hy_cap: "So funktionierte ein Hypokaustum: Ein Ofen außerhalb des Raums trieb heiße Luft unter einen auf niedrigen Ziegelpfeilern ruhenden Boden und dann durch Hohlziegel in den Wänden nach oben. Eine typische römische Bauweise, nicht der Plan der Villa von Rakovac."
