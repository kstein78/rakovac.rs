gd_sc_title: "Rekonstruktionsskizze der Chorschranke aus dem 12. Jahrhundert"
gd_sc_cap: "Die marmorne Chorschranke des 12. Jahrhunderts, Rekonstruktionsskizze nach einer ungarischen Studie der Funde von Dombó. Vier Brüstungsplatten, je etwa 1 m breit und 80–90 cm hoch (je eine in den Seitenschiffen, zwei im Mittelschiff mit einem Durchgang dazwischen), vier kleinere Felder, darüber Säulchen; insgesamt etwa 2,8–2,9 m hoch. In diesem Maßstab gezeichnet; das Motiv jeder Platte ist eine Annahme."
