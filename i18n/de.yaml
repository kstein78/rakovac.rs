gd_period: "Epoche"
gd_plan_title: "Schematischer Plan der Gradina nach Epochen"
gd_plan_cap: "Die Gradina, Epoche für Epoche. Wählen Sie eine Epoche: Ihre Bauten sind kräftig gezeichnet, ältere bleiben darunter als blasse Umrisse, denn jede Generation baute auf den Ruinen der vorigen."
gd_not_to_scale: "Schema, nicht maßstabsgetreu: Die Formen folgen veröffentlichten Beschreibungen, nicht einem vermessenen Plan."
gd_leg_d: "Quellen widersprechen sich"
gd_leg_a: "Annahme der Zeichnung"
gd_p0_name: "Eisenzeit"
gd_p0_when: "Jungsteinzeit, dann ältere Eisenzeit"
gd_p0_1: "Die ältesten Funde auf dem Hügel stammen aus der Jungsteinzeit und sind rund 7.000 Jahre alt."
gd_p0_2: "Die untersten Schichten enthalten Reste eines Erdwalls aus der älteren Eisenzeit."
gd_p0_3: "Form und Größe des Walls sind nur zur Veranschaulichung gezeichnet."
gd_p1_name: "Römische Villa"
gd_p1_when: "Spätrömische Zeit, 3.–4. Jahrhundert"
gd_p1_1: "Eine Villa mit Hypokaustum, der römischen Fußbodenheizung."
gd_p1_2: "Berichtet wird auch von Mosaikböden und Wasserleitungen."
gd_p1_3: "Raumaufteilung und Lage des Ofens sind Annahmen."
gd_p2_name: "Basilika"
gd_p2_when: "12. Jahrhundert"
gd_p2_1: "Eine romanische dreischiffige Basilika von etwa 32 m Länge mit drei halbrunden Apsiden und einer Krypta."
gd_p2_2: "Eine gemeißelte Chorschranke aus Marmor trennte das Schiff vom Altar."
gd_p2_3: "Die Datierung ist umstritten: frühes 12. Jahrhundert unter König Koloman oder Gründung 1176–86."
gd_p3_name: "Abtei St. Georg"
gd_p3_when: "1237 – 15. Jahrhundert"
gd_p3_1: "Erstmals in einer Urkunde von 1237 genannt („Abbas de Dombo“)."
gd_p3_2: "1390: Kloster des heiligen Georg von Dombó, Diözese Kalocsa."
gd_p3_3: "1416: Abt Georg gerät in die Gefangenschaft osmanischer Streifscharen."
gd_p4_name: "Festung"
gd_p4_when: "1467–1473"
gd_p4_1: "Die Abtei wird zu einer Festung mit Mauern, Toren und Graben umgebaut."
gd_p4_2: "Eine gotische Kirche mit dreiseitiger Apsis entsteht teils auf den romanischen Fundamenten."
gd_p4_3: "Der Verlauf von Mauer und Graben ist nur nach der Beschreibung gezeichnet."
gd_p5_name: "Ruine und heute"
gd_p5_when: "1526 – heute"
gd_p5_1: "1526: Dombó fällt im osmanischen Feldzug, der bei Mohács endete."
gd_p5_2: "Endgültige Zerstörung: Manche Quellen nennen 1702, andere 1792."
gd_p5_3: "Ausgegraben vom Museum der Vojvodina 1963–1978 und später; geschütztes Kulturgut."
