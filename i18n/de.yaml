# Old photos call and photo archive
pc_title: "Haben Sie alte Fotos von Rakovac?"
pc_text: "Wir sammeln Fotos von Rakovac aus allen Jahrzehnten: Straßen und Häuser, Feste und Hochzeiten, Arbeit auf dem Feld und im Weinberg, Menschen in Tracht oder in Partisanenuniform, die Schule, das Kloster. Schicken Sie ein Foto, einen Scan oder einfach eine Handyaufnahme eines alten Abzugs und schreiben Sie dazu, wer darauf ist und wann, wenn Sie es wissen. Wir nennen die Person, die es geschickt hat, und den Fotografen."
pc_visit: "Keine Möglichkeit zu scannen? Konstantin, der diese Seite macht, kommt gern vorbei und fotografiert die Bilder bei Ihnen zu Hause ab; die Originale bleiben bei Ihnen. Rufen Sie an oder schreiben Sie:"
pc_consent: "Wir veröffentlichen ein Foto nur mit Ihrer Erlaubnis und entfernen es, sobald Sie das wünschen."
