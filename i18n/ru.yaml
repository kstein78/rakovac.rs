gd_plan_title: "Схематический план Градины по эпохам"
gd_plan_cap: "Градина по эпохам. Выберите период: его постройки нарисованы сплошными линиями, более старые остаются под ними бледными контурами — каждое поколение строило на руинах предыдущего."
gd_not_to_scale: "Схема, не в масштабе: формы нарисованы по опубликованным описаниям, а не по обмерному плану."
gd_leg_d: "источники расходятся"
gd_leg_a: "допущение рисунка"
gd_p0_name: "Железный век"
gd_p0_when: "Неолит, затем ранний железный век"
gd_p0_1: "Самые древние находки на холме относятся к неолиту, им около 7 000 лет."
gd_p0_2: "В самых нижних слоях — остатки земляного вала раннего железного века."
gd_p0_3: "Форма и размер вала нарисованы условно."
gd_p1_name: "Римская вилла"
gd_p1_when: "Позднеримское время, III–IV века"
gd_p1_1: "Вилла с гипокаустом — римским подпольным отоплением."
gd_p1_2: "Сообщается также о мозаичных полах и водопроводе."
gd_p1_3: "Расположение комнат и печи — допущение."
gd_p2_name: "Базилика"
gd_p2_when: "XII век"
gd_p2_1: "Романская трёхнефная базилика длиной около 32 м с тремя полукруглыми апсидами и криптой."
gd_p2_2: "Резная мраморная алтарная преграда отделяла неф от алтаря."
gd_p2_3: "Дата спорна: начало XII века, время короля Кальмана, или основание в 1176–1186 годах."
gd_p3_name: "Аббатство св. Георгия"
gd_p3_when: "1237 – XV век"
gd_p3_1: "Впервые названо в грамоте 1237 года («Abbas de Dombo»)."
gd_p3_2: "1390: монастырь святого Георгия в Домбо, Калочская епархия."
gd_p3_3: "1416: аббата Георгия берут в плен османские налётчики."
gd_p4_name: "Крепость"
gd_p4_when: "1467–1473"
gd_p4_1: "Аббатство перестраивают в крепость со стенами, воротами и рвом."
gd_p4_2: "Готический храм с трёхгранной апсидой встаёт частично на романских фундаментах."
gd_p4_3: "Линия стены и рва нарисована только по описанию."
gd_p5_name: "Руины и сегодня"
gd_p5_when: "1526 – наши дни"
gd_p5_1: "1526: Домбо пал в османском походе, закончившемся при Мохаче."
gd_p5_2: "Окончательное разрушение: одни источники называют 1702 год, другие 1792-й."
gd_p5_3: "Раскопки Музея Воеводины в 1963–1978 годах и позже; охраняемое культурное наследие."
