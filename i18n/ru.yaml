gd_sc_cap: "Мраморная алтарная преграда XII века — эскиз реконструкции по венгерскому исследованию находок Домбо. Четыре плиты парапета шириной около 1 м и высотой 80–90 см (по одной в боковых нефах, две в главном, между ними проход), четыре панели поменьше, сверху колонки; общая высота около 2,8–2,9 м. Нарисовано в этом масштабе; мотив каждой плиты — допущение."
