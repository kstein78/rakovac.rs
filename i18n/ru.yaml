# Old photos call and photo archive
pc_title: "Есть старые фотографии Раковца?"
pc_text: "Мы собираем фотографии Раковца разных лет: улицы и дома, праздники и свадьбы, работа в поле и на винограднике, люди в народных костюмах или в партизанской форме, школа, монастырь. Пришлите снимок, скан или просто фото старой карточки на телефон и расскажите, кто на ней и когда, если знаете. Мы укажем и того, кто прислал, и того, кто снимал."
