# Old photos call and photo archive
pc_title: "Do you have old photos of Rakovac?"
pc_text: "We are collecting photos of Rakovac from every decade: streets and houses, feasts and weddings, work in the fields and vineyards, people in folk costume or in partisan uniform, the school, the monastery. Send a photo, a scan or simply a phone picture of an old print, and tell us who and when, if you know. We credit both the person who shared it and the photographer."
pc_visit: "No way to scan them? Konstantin, who makes this site, will gladly come by and photograph the pictures at your home; the originals stay with you. Call or write:"
pc_consent: "We publish a photo only with your permission and remove it whenever you ask."
