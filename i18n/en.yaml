gd_sc_title: "Reconstruction sketch of the 12th-century chancel screen"
gd_sc_cap: "The 12th-century marble chancel screen: a reconstruction sketch after a Hungarian study of the Dombó finds. Four parapet slabs, each about 1 m wide and 80–90 cm high (one in each side aisle, two in the nave with a passage between them), four smaller panels, columns above; about 2.8–2.9 m high in total. Drawn to that scale; the motif on each slab is an assumption."
