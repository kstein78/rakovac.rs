gd_period: "Period"
gd_plan_title: "Schematic plan of Gradina, period by period"
gd_plan_cap: "Gradina, period by period. Pick a period: its buildings are drawn solid, older ones stay underneath as faint outlines, because each generation built on the ruins of the last."
gd_not_to_scale: "Schematic, not to scale: the shapes follow published descriptions, not a measured plan."
gd_leg_d: "sources disagree"
gd_leg_a: "an assumption of the drawing"
gd_p0_name: "Iron Age"
gd_p0_when: "Neolithic, then the older Iron Age"
gd_p0_1: "The oldest finds on the hill are Neolithic, about 7,000 years old."
gd_p0_2: "The lowest layers hold the remains of an earth rampart from the older Iron Age."
gd_p0_3: "The shape and size of the rampart are drawn for illustration only."
gd_p1_name: "Roman villa"
gd_p1_when: "Late Roman period, 3rd–4th century"
gd_p1_1: "A villa with a hypocaust, the Roman underfloor heating."
gd_p1_2: "Mosaic floors and water pipes are also reported."
gd_p1_3: "The room layout and the position of the furnace are assumptions."
gd_p2_name: "Basilica"
gd_p2_when: "12th century"
gd_p2_1: "A Romanesque three-aisled basilica about 32 m long, with three semicircular apses and a crypt."
gd_p2_2: "A carved marble chancel screen separated the nave from the altar."
gd_p2_3: "The date is disputed: early 12th century under King Coloman, or founded in 1176–86."
gd_p3_name: "Abbey of St George"
gd_p3_when: "1237 – 15th century"
gd_p3_1: "First named in a charter of 1237 (“Abbas de Dombo”)."
gd_p3_2: "1390: the monastery of St George of Dombó, in the diocese of Kalocsa."
gd_p3_3: "1416: Abbot George is taken prisoner by Ottoman raiders."
gd_p4_name: "Fortress"
gd_p4_when: "1467–1473"
gd_p4_1: "The abbey is rebuilt as a fortress with walls, gates and a moat."
gd_p4_2: "A Gothic church with a three-sided apse rises partly on the Romanesque foundations."
gd_p4_3: "The line of the wall and the moat is drawn from the description only."
gd_p5_name: "Ruin and today"
gd_p5_when: "1526 – today"
gd_p5_1: "1526: Dombó falls in the Ottoman campaign that ended at Mohács."
gd_p5_2: "Final destruction: some sources name 1702, others 1792."
gd_p5_3: "Excavated by the Museum of Vojvodina in 1963–1978 and later; protected cultural property."
