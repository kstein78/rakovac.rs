gd_hy_title: "How a hypocaust heated a room"
gd_hy_cap: "How a hypocaust worked: a furnace outside the room pushed hot air under a floor raised on short brick pillars, then up through hollow tiles in the walls. A typical Roman design, not the plan of the Rakovac villa."
