gd_p2_name: "Базилика"
gd_p2_when: "12. век"
gd_p2_1: "Романичка тробродна базилика дуга око 32 м, са три полукружне апсиде и криптом."
gd_p2_2: "Клесана мермерна олтарска преграда одвајала је брод од олтара."
