gd_p4_name: "Тврђава"
gd_p4_when: "1467–1473"
gd_p4_1: "Опатија се претвара у тврђаву са зидинама, капијама и шанцем."
gd_p4_2: "Готичка црква са тространом апсидом подиже се делом на романичким темељима."
gd_p4_3: "Линија зида и шанца нацртана је само према опису."
gd_p5_name: "Рушевине и данас"
