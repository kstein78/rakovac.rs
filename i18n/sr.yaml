# Old photos call and photo archive
pc_title: "Imate stare fotografije Rakovca?"
pc_text: "Sakupljamo fotografije Rakovca iz svih vremena: ulice i kuće, slave i svadbe, rad u polju i vinogradu, ljude u narodnoj nošnji ili partizanskoj uniformi, školu, manastir. Pošaljite fotografiju, sken ili samo snimak stare slike telefonom i napišite ko je na njoj i kada, ako znate. Navešćemo i ko je fotografiju poslao i ko ju je snimio."
pc_visit: "Nemate kako da skenirate? Konstantin, autor sajta, rado će doći u goste i presnimiti fotografije kod vas kući, a originali ostaju kod vas. Pozovite ili pišite:"
pc_consent: "Fotografiju objavljujemo samo uz vašu dozvolu i uklanjamo je čim to zatražite."
