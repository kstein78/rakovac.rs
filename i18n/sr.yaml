gd_plan_title: "Šematski plan Gradine po razdobljima"
gd_plan_cap: "Gradina po razdobljima. Izaberite razdoblje: njegove građevine su nacrtane punim linijama, a starije ostaju ispod kao blede konture, jer je svaka generacija gradila na ruševinama prethodne."
gd_not_to_scale: "Šema, nije u razmeri: oblici prate objavljene opise, a ne izmereni plan."
gd_leg_d: "izvori se ne slažu"
gd_leg_a: "pretpostavka crteža"
gd_p0_name: "Gvozdeno doba"
gd_p0_when: "Neolit, zatim starije gvozdeno doba"
gd_p0_1: "Najstariji nalazi na brdu su neolitski, stari oko 7.000 godina."
gd_p0_2: "U najnižim slojevima su ostaci zemljanog bedema iz starijeg gvozdenog doba."
gd_p0_3: "Oblik i veličina bedema nacrtani su samo ilustrativno."
gd_p1_name: "Rimska vila"
gd_p1_when: "Kasnorimsko doba, 3–4. vek"
gd_p1_1: "Vila sa hipokaustom, rimskim podnim grejanjem."
gd_p1_2: "Pominju se i mozaički podovi i vodovodne cevi."
gd_p1_3: "Raspored prostorija i položaj peći su pretpostavka."
gd_p2_name: "Bazilika"
gd_p2_when: "12. vek"
gd_p2_1: "Romanička trobrodna bazilika duga oko 32 m, sa tri polukružne apside i kriptom."
gd_p2_2: "Klesana mermerna oltarska pregrada odvajala je brod od oltara."
gd_p2_3: "Datum je sporan: početak 12. veka, u doba kralja Kolomana, ili osnivanje 1176–1186."
gd_p3_name: "Opatija Svetog Đorđa"
gd_p3_when: "1237 – 15. vek"
gd_p3_1: "Prvi put se pominje u povelji iz 1237. („Abbas de Dombo“)."
gd_p3_2: "1390: manastir Svetog Đorđa u Dombu, u Kaločkoj biskupiji."
gd_p3_3: "1416: opata Đorđa zarobljavaju osmanski pljačkaši."
gd_p4_name: "Tvrđava"
gd_p4_when: "1467–1473"
gd_p4_1: "Opatija se pretvara u tvrđavu sa zidinama, kapijama i šancem."
gd_p4_2: "Gotička crkva sa trostranom apsidom podiže se delom na romaničkim temeljima."
gd_p4_3: "Linija zida i šanca nacrtana je samo prema opisu."
gd_p5_name: "Ruševine i danas"
gd_p5_when: "1526 – danas"
gd_p5_1: "1526: Dombo pada u osmanskom pohodu koji se završio kod Mohača."
gd_p5_2: "Konačno rušenje: jedni izvori navode 1702, drugi 1792. godinu."
gd_p5_3: "Iskopavanja Muzeja Vojvodine 1963–1978. i kasnije; zaštićeno kulturno dobro."
