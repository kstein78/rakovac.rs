danube_note: "Zvanično dnevno merenje Republičkog hidrometeorološkog zavoda Srbije (RHMZ) na vodomeru Novi Sad, nizvodno od Beočina. Vodostaj se računa od nule vodomera (71,73 m nadmorske visine), pa minus znači nisku vodu. Redovna odbrana od poplava počinje na 450 cm, vanredna na 700 cm. Kad je Dunav jako nizak, skela u Beočinu može da stane."
