baseURL = "https://rakovac.rs/"
title = "Rakovac"
enableRobotsTXT = true
enableGitInfo = true   # page dates (sitemap lastmod, Article dateModified) come from the last git commit
timeZone = "Europe/Belgrade"

# --- Languages -------------------------------------------------------------
# Five live languages: en (source), sr (Latin; cyr = the same text in Serbian Cyrillic, generated), ru, de, hu.
# content/en is the source; the other languages are kept in sync by
# scripts/translate.py (see README, "Automatic translation").
# To switch a language off temporarily, list it in disableLanguages.
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = true
disableLanguages = []

[languages]
  [languages.en]
    languageName = "English"
    languageCode = "en"
    weight = 3
    contentDir = "content/en"
    [languages.en.params]
      tagline = "A village on the northern slope of Fruška Gora"
      description = "Unofficial visitor portal of Rakovac on Fruška Gora: nature and walks, the monastery, 7,000 years of history, places to stay, local food and wine."
      ogLocale = "en_US"
  [languages.sr]
    languageName = "Srpski"
    languageCode = "sr-Latn"
    weight = 1
    contentDir = "content/sr"
    [languages.sr.params]
      tagline = "Selo na severnoj padini Fruške gore"
      description = "Nezvanični portal za posetioce Rakovca na Fruškoj gori: priroda i šetnje, manastir, 7.000 godina istorije, smeštaj, domaća hrana i vino."
      ogLocale = "sr_RS"
  [languages.cyr]
    # Serbian in Cyrillic: generated from the Latin text by scripts/sr_cyrl.py (do not translate by hand).
    languageName = "Српски"
    languageCode = "sr-Cyrl"
    weight = 2
    contentDir = "content/cyr"
    [languages.cyr.params]
      tagline = "Село на северној падини Фрушке горе"
      description = "Незванични портал за посетиоце Раковца на Фрушкој гори: природа и шетње, манастир, 7.000 година историје, смештај, домаћа храна и вино."
      ogLocale = "sr_RS"
  [languages.ru]
    languageName = "Русский"
    languageCode = "ru"
    weight = 4
    contentDir = "content/ru"
    [languages.ru.params]
      tagline = "Село на северном склоне Фрушка-Горы"
      description = "Неофициальный портал для гостей Раковца на Фрушка-Горе: природа и прогулки, монастырь, 7 000 лет истории, жильё, местная еда и вино."
      ogLocale = "ru_RU"
  [languages.de]
    languageName = "Deutsch"
    languageCode = "de"
    weight = 5
    contentDir = "content/de"
    [languages.de.params]
      tagline = "Ein Dorf am Nordhang der Fruška Gora"
      description = "Inoffizielles Besucherportal von Rakovac an der Fruška Gora: Natur und Wanderungen, das Kloster, 7.000 Jahre Geschichte, Unterkünfte, Essen und Wein aus der Region."
      ogLocale = "de_DE"
  [languages.hu]
    languageName = "Magyar"
    languageCode = "hu"
    weight = 6
    contentDir = "content/hu"
    [languages.hu.params]
      tagline = "Falu a Tarcal-hegység északi lejtőjén"
      description = "Rakovac nem hivatalos látogatói portálja a Tarcal-hegységben: természet és séták, a kolostor, 7000 év történelem, szállás, helyi ételek és bor."
      ogLocale = "hu_HU"

# --- Site-wide settings ----------------------------------------------------
[params]
  # Village centre (Novi Rakovac) and the monastery, used by the maps.
  mapCenter = [45.1950, 19.7700]
  mapZoom = 14
  # Draft helpers: off on rakovac.rs, on in the GitHub Pages preview (see .github/workflows/deploy.yml, job "pages"),
  # so the editor sees open questions there while visitors see a clean site.
  showPhotoBadges = false  # yellow "TEMP PHOTO" badge on borrowed photos
  showTodos = false        # yellow editor notes written with {{< todo >}}
  contactEmail = "konstantin.stein@gmail.com"
  contactPhone = "+381638015320"          # used in tel:, WhatsApp, Viber, Telegram links
  contactPhoneDisplay = "+381 63 801 5320"
  authorSite = "https://stein-1.com"
  # Statistics and search-engine verification (empty = off). GA4 loads only after the visitor allows it
  # (consent banner, Consent Mode v2); nothing is loaded on the GitHub Pages preview (noindex).
  gaID = "G-5S60GN5X2B"         # Google Analytics 4 measurement ID, e.g. "G-XXXXXXXXXX"
  googleSiteVerification = ""   # Search Console HTML-tag code (not needed with DNS verification)
  bingSiteVerification = ""     # Bing Webmaster msvalidate.01 (not needed when imported from Search Console)
  yandexVerification = ""       # Yandex Webmaster
  yandexMetrica = "113164709"
  # The village in the knowledge graph (schema.org sameAs on the home page): Wikidata Q908197 and its Wikipedia articles.
  villageSameAs = ["https://www.wikidata.org/wiki/Q908197", "https://en.wikipedia.org/wiki/Rakovac,_Beo%C4%8Din", "https://sr.wikipedia.org/wiki/%D0%A0%D0%B0%D0%BA%D0%BE%D0%B2%D0%B0%D1%86_(%D0%91%D0%B5%D0%BE%D1%87%D0%B8%D0%BD)", "https://de.wikipedia.org/wiki/Rakovac_(Beo%C4%8Din)", "https://hu.wikipedia.org/wiki/Domb%C3%B3_(Szerbia)", "https://sh.wikipedia.org/wiki/Rakovac_(Beo%C4%8Din)"]          # Yandex Metrica counter number; loaded only after the visitor allows statistics

[taxonomies]
  # none used for now; categories live in front matter "category"

[markup.goldmark.renderer]
  unsafe = true

[outputFormats.llms]
  # /llms.txt: a short guide to the site for AI assistants (layouts/index.llms.txt), written once at the root
  mediaType = "text/plain"
  baseName = "llms"
  isPlainText = true
  notAlternative = true
  root = true

[outputs]
  home = ["HTML", "RSS", "llms"]
  section = ["HTML"]

[sitemap]
  changeFreq = "monthly"
