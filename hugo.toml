baseURL = "https://rakovac.rs/"
title = "Rakovac"
enableRobotsTXT = true
timeZone = "Europe/Belgrade"

# --- Languages -------------------------------------------------------------
# All five languages are configured. English, Serbian (Latin) and Russian are live; German and Hungarian are prepared.
# To switch a language on: translate content/<lang>/, then remove it from
# disableLanguages below. UI strings for all five already live in i18n/.
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = true
disableLanguages = ["de", "hu"]

[languages]
  [languages.en]
    languageName = "English"
    languageCode = "en"
    weight = 1
    contentDir = "content/en"
    [languages.en.params]
      tagline = "A village on the northern slope of Fruška Gora"
  [languages.sr]
    languageName = "Srpski"
    languageCode = "sr-Latn"
    weight = 2
    contentDir = "content/sr"
    [languages.sr.params]
      tagline = "Selo na severnoj padini Fruške gore"
  [languages.ru]
    languageName = "Русский"
    languageCode = "ru"
    weight = 3
    contentDir = "content/ru"
    [languages.ru.params]
      tagline = "Село на северном склоне Фрушка-Горы"
  [languages.de]
    languageName = "Deutsch"
    languageCode = "de"
    weight = 4
    contentDir = "content/de"
    [languages.de.params]
      tagline = "Ein Dorf am Nordhang der Fruška Gora"
  [languages.hu]
    languageName = "Magyar"
    languageCode = "hu"
    weight = 5
    contentDir = "content/hu"
    [languages.hu.params]
      tagline = "Falu a Tarcal-hegység északi lejtőjén"

# --- Site-wide settings ----------------------------------------------------
[params]
  description = "Unofficial visitor portal of Rakovac: nature, walks, the monastery, history, places to stay, local food and wine."
  # Village centre (Novi Rakovac) and the monastery, used by the maps.
  mapCenter = [45.1950, 19.7700]
  mapZoom = 14
  # Draft helpers. Set both to false before the public launch.
  showPhotoBadges = true   # yellow "TEMP PHOTO" badge on borrowed photos
  showTodos = true         # yellow editor notes written with {{< todo >}}
  contactEmail = "konstantin.stein@gmail.com"
  contactPhone = "+381638015320"          # used in tel:, WhatsApp, Viber, Telegram links
  contactPhoneDisplay = "+381 63 801 5320"
  authorSite = "https://stein-1.com"

[taxonomies]
  # none used for now; categories live in front matter "category"

[markup.goldmark.renderer]
  unsafe = true

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML"]

[sitemap]
  changeFreq = "monthly"
