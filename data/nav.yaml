# Main menu: groups shown as drop-down lists in the header (and as columns in the footer). On phones the groups
# are folded: the menu shows only the group names, a tap opens one group.
# "hub" is the overview page of the group (content/<lang>/<hub>/_index.md, type hub): it lists the group's sections
# with photos, is linked first in the drop-down and appears in the breadcrumbs of the pages of the group.
# "path" is the section folder under content/<lang>/; the link text is the page's linkTitle.
# An item may point to an anchor on a page ("anchor") and then needs its own i18n "label".
# A single page (not a section) can be listed too; "notile: true" keeps it off the home-page section tiles.
# "photo" (optional) = picture for the item's card on the overview page, when the section has none of its own.
# "direct" = also shown as a plain link next to the groups.
menu:
  - id: explore
    label: nav_g_explore
    hub: explore
    items:
      - { path: history }
      - { path: nature }
      - { path: monastery }
      - { path: nearby }
      - { path: people }
      - { path: gallery }
  - id: do
    label: nav_g_do
    hub: activities
    items:
      - { path: routes }
      - { path: kids }
      - { path: map, photo: map-preview }
  - id: stay
    label: nav_g_stay
    hub: stay-eat
    items:
      - { path: stay }
      - { path: eat-drink }
      - { path: local-products }
      - { path: shops }
  - id: info
    label: nav_g_info
    hub: useful
    items:
      - { path: useful }
      - { path: useful, anchor: bus, label: bus_title }
      - { path: nearby/ferry-beocin-futog, notile: true }
      - { path: useful, anchor: weather, label: weather_title }
      - { path: useful, anchor: air, label: air_title }
      - { path: useful, anchor: danube, label: danube_title }
# Pages about the site itself: not in the header menu (to keep it short, especially on phones), but in the footer
# and on the home-page tiles as before, so they stay linked from every page.
more:
  id: site
  label: nav_g_site
  items:
    - { path: business }
    - { path: support }
    - { path: fonts }
    - { path: about }
    - { path: author }
direct:
  - { path: news }
  - { path: map }

# Map marker colours per category (front matter "category").
categories:
  nature:   { label: cat_nature,   color: "#3f7a3a" }
  heritage: { label: cat_heritage, color: "#7b3f63" }
  stay:     { label: cat_stay,     color: "#2f5f8a" }
  food:     { label: cat_food,     color: "#b35a1f" }
  products: { label: cat_products, color: "#a5801b" }
  shops:    { label: cat_shops,    color: "#56616b" }
  business: { label: cat_business, color: "#3d4a57" }
  services: { label: cat_services, color: "#b3261e" }
  kids:     { label: cat_kids,     color: "#1f8a86" }
  nearby:   { label: cat_nearby,   color: "#5c4a8a" }
