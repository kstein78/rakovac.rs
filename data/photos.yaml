# Photo registry.
# Every photo on the site is referenced by its key (front matter "photo:" or
# the {{< photo >}} shortcode). The site prints the credit line automatically.
#
# temp: true  -> borrowed open-licence photo, shown with a yellow TEMP badge
#                while params.showPhotoBadges = true. Replace with our own shot.
# To replace: drop your file into static/img/, then change "src" to
# "/img/your-file.jpg", set author/license to your own, and set temp: false.
#
# All entries below were checked on Wikimedia Commons on 2026-09-26
# (licence + author read from the file page; each 1280px thumbnail loaded OK).

