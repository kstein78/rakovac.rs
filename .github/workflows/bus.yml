name: Bus timetable

# Reads the official JGSP Novi Sad timetable for lines 77 and 78 (gspns.co.rs) into data/bus.yaml
# and commits it to main when it changed (the Hetzner server then rebuilds the site by itself).
# The raw pages are published on the branch "bus-raw" for checking.
# Runs every Monday, when the script changes, or by hand (Actions -> Bus timetable -> Run workflow).
on:
  push:
    branches: [main]
    paths: [scripts/bus_fetch.py, .github/workflows/bus.yml]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bus-timetable
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Fetch and parse the official timetable
        run: python3 scripts/bus_fetch.py
      - name: Commit data/bus.yaml if it changed
        run: |
          git config user.name "rakovac-bot"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet -- data/bus.yaml && git ls-files --error-unmatch data/bus.yaml >/dev/null 2>&1; then
            echo "Timetable unchanged."
          else
            git add data/bus.yaml
            # "fetched" changes every run: commit only if a departure changed
            if git diff --cached -U0 -- data/bus.yaml | grep -E '^[+-] ' | grep -vq 'fetched:'; then
              git commit -qm "Bus timetable: update from gspns.co.rs"
              git pull -q --rebase origin main
              git push -q origin HEAD:main
            else
              echo "Only the fetch time changed."
              git reset -q
            fi
          fi
      - name: Publish raw pages on branch bus-raw
        env:
          TOKEN: ${{ github.token }}
        run: |
          cd bus-raw
          git init -q -b bus-raw
          git config user.name "rakovac-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -qm "Raw JGSP timetable pages $(date -u +%F)"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" bus-raw
