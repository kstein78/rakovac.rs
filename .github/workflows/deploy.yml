name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  HUGO_VERSION: 0.139.4

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Hugo (extended)
        run: |
          wget -q -O hugo.deb "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i hugo.deb
          hugo version

      - name: Build site
        run: hugo --gc --minify

      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: public
          retention-days: 7

  # Deploys to the Hetzner server with rsync over SSH.
  # Runs only on pushes to main, and only when the DEPLOY_HOST secret exists.
  # Secrets to add in GitHub → Settings → Secrets and variables → Actions:
  #   DEPLOY_HOST         server IP or hostname
  #   DEPLOY_USER         e.g. deploy
  #   DEPLOY_PATH         e.g. /var/www/rakovac.rs
  #   DEPLOY_KEY          private SSH key (ed25519) of the deploy user
  #   DEPLOY_KNOWN_HOSTS  output of: ssh-keyscan -t ed25519 <server>
  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: public

      - name: Check that server secrets are set
        id: check
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          if [ -n "$HOST" ]; then echo "ready=true" >> "$GITHUB_OUTPUT"; else echo "ready=false" >> "$GITHUB_OUTPUT"; fi

      - name: Upload to server
        if: steps.check.outputs.ready == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          rsync -az --delete --chmod=D755,F644 \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            public/ "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/"

      - name: Server not configured yet
        if: steps.check.outputs.ready != 'true'
        run: echo "::notice::DEPLOY_HOST secret is not set, so the site was built but not uploaded."

  # Preview on GitHub Pages: https://kstein78.github.io/rakovac.rs/
  # One-time: repo Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
  # The preview is marked noindex so search engines don't compete with rakovac.rs.
  # To switch it off later, delete this job (and set Pages source to "None").
  pages:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Hugo (extended)
        run: |
          wget -q -O hugo.deb "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i hugo.deb

      - id: pages
        uses: actions/configure-pages@v6

      - name: Build preview
        env:
          HUGO_PARAMS_NOINDEX: "true"
        run: |
          hugo --gc --minify --baseURL "${{ steps.pages.outputs.base_url }}/"
          cp public/en/404.html public/404.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: public

      - id: deployment
        uses: actions/deploy-pages@v5
