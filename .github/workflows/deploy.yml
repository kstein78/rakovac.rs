name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  HUGO_VERSION: 0.139.4

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Hugo (extended)
        run: |
          wget -q -O hugo.deb "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i hugo.deb
          hugo version

      - name: Build site
        run: hugo --gc --minify

      - name: SEO check (descriptions in each language, canonical, hreflang, Open Graph, JSON-LD)
        run: python3 scripts/seo_check.py public

      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: public
          retention-days: 7

  # The Hetzner server deploys itself: every minute it checks main, rebuilds and switches
  # (see deploy/cloud-init.yaml and deploy/build.sh). No secrets are needed here.
  # This job only proves it: it waits until https://rakovac.rs/version.txt shows this
  # commit (or a newer one) and fails if that does not happen within 10 minutes.
  # While the server is not live yet, it skips with a notice.
  live:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Wait until rakovac.rs serves this commit
        run: |
          url=https://rakovac.rs/version.txt
          get() { curl -fsS --max-time 15 "$url?t=$(date +%s%N)" 2>/dev/null | head -1 || true; }
          live=$(get)
          if ! printf '%s' "$live" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::notice::rakovac.rs does not serve version.txt yet, so the server is not live. Nothing to check."
            exit 0
          fi
          for i in $(seq 1 40); do
            git fetch -q origin main
            if git merge-base --is-ancestor "$GITHUB_SHA" "$live" 2>/dev/null; then
              echo "rakovac.rs is live with $live (includes $GITHUB_SHA)"
              exit 0
            fi
            sleep 15
            live=$(get)
          done
          echo "::error::after 10 minutes rakovac.rs still serves $live, not $GITHUB_SHA. On the server: journalctl -u rakovac-update"
          exit 1

      - name: "Tell search engines what changed (IndexNow: Bing, Yandex, Seznam)"
        continue-on-error: true
        run: python3 scripts/indexnow.py "${{ github.event.before }}" "$GITHUB_SHA"

  # Preview on GitHub Pages: https://kstein78.github.io/rakovac.rs/
  # One-time: repo Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
  # The preview is marked noindex so search engines don't compete with rakovac.rs.
  # To switch it off later, delete this job (and set Pages source to "None").
  pages:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Hugo (extended)
        run: |
          wget -q -O hugo.deb "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i hugo.deb

      - id: pages
        uses: actions/configure-pages@v6

      - name: Build preview
        env:
          HUGO_PARAMS_NOINDEX: "true"
        run: |
          hugo --gc --minify --baseURL "${{ steps.pages.outputs.base_url }}/"
          cp public/en/404.html public/404.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: public

      - id: deployment
        uses: actions/deploy-pages@v5
